<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Portal Kampus Fiktif</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Portal Kampus</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username / Role</label>
                <select id="roleSelect" class="form-select">
                    <option value="mahasiswa">Mahasiswa (Budi)</option>
                    <option value="dosen">Dosen (Dr. Andi)</option>
                    <option value="admin">Admin Kampus</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Masuk</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
