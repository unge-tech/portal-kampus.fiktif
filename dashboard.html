<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Portal Kampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="#">Portal Fiktif</a>
        <button onclick="logout()" class="btn btn-outline-light ms-auto">Keluar</button>
    </nav>

    <div class="container my-4">
        <h2 id="welcomeText">Selamat Datang</h2>
        <hr>

        <!-- Fitur Mahasiswa / Dosen / Admin -->
        <div id="contentArea" class="row">
            <!-- Konten dinamis berdasarkan role -->
        </div>

        <!-- Fitur Diskusi (Rentan Stored XSS) -->
        <div class="card mt-4 p-3 shadow-sm">
            <h4>Forum Diskusi Kampus <span class="badge bg-danger fs-6">Rentan Stored XSS</span></h4>
            <div class="input-group mb-3">
                <input type="text" id="chatInput" class="form-control" placeholder="Tulis pesan diskusi...">
                <button class="btn btn-success" onclick="postComment()">Kirim</button>
            </div>
            <div id="chatContainer" class="border p-3 bg-white rounded" style="min-height: 100px;">
                <!-- Komentar muncul di sini -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
